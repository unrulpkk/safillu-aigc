limit_req_zone $binary_remote_addr zone=zaomeng_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zaomeng_oauth:10m rate=30r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src 'self' https://checkout.stripe.com https://js.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /studio-config.js {
        default_type application/javascript;
        add_header Cache-Control no-store;
        return 200 'window.STUDIO_CONFIG={cloudEnabled:true,apiBase:"",studioUrl:""};';
    }
    location ~ ^/admin-api/system/auth/(login|register|logout|refresh-token)$ {
        limit_req zone=zaomeng_auth burst=15 nodelay;
        limit_req_status 429;
        # Tokens and refresh parameters must not enter access logs.
        access_log off;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header tenant-id 1;
    }
    location ~ ^/admin-api/system/user/profile/(get|update|update-password)$ {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        access_log off;
    }
    location = /admin-api/aigc/payments/stripe/webhook {
        client_max_body_size 256k;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header tenant-id 1;
        access_log off;
    }
    location = /app-api/member/auth/google-login {
        limit_req zone=zaomeng_oauth burst=10 nodelay;
        proxy_pass http://backend:48080/admin-api/aigc/auth/google/callback;
        proxy_set_header tenant-id 1;
        access_log off;
        add_header Referrer-Policy no-referrer always;
    }
    location ^~ /admin-api/aigc/auth/google/ {
        client_max_body_size 16k;
        limit_req zone=zaomeng_oauth burst=10 nodelay;
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        access_log off;
        add_header Referrer-Policy no-referrer always;
    }
    location ^~ /admin-api/aigc/auth/email/ {
        client_max_body_size 4k;
        limit_req zone=zaomeng_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:48080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 90s;
        access_log off;
    }
    # Operational writes belong to Ruoyi Admin, not the creator website.
    location ~ ^/admin-api/aigc/(manage(/|$)|explore/(manage|permissions)(/|$)) { return 404; }
    location /admin-api/aigc/ {
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 90s;
        access_log off;
    }
    # Framework admin, public file download, docs, metrics and debug interfaces
    # are not exposed by the creator website.
    location /admin-api/ { return 404; }
    location /app-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
