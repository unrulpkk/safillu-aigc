limit_req_zone $binary_remote_addr zone=zaomeng_admin_auth:10m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location = /infra/ws {
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header tenant-id 1;
        proxy_read_timeout 300s;
        access_log off;
    }
    location ~ ^/admin-api/system/auth/(login|logout|refresh-token)$ {
        limit_req zone=zaomeng_admin_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header tenant-id 1;
        access_log off;
    }
    location = /admin-api/system/auth/get-permission-info {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        access_log off;
    }
    location = /admin-api/system/dict-data/simple-list {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
    }
    location ~ ^/admin-api/system/user/profile/(get|update|update-password)$ {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        access_log off;
    }
    location /admin-api/aigc/manage/ {
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 120s;
        access_log off;
    }
    location /admin-api/aigc/explore/ {
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 120s;
        access_log off;
    }
    # The native Java permission interceptors enforce System/Infra RBAC.
    # Public account registration remains on the creator site's existing gateway.
    location /admin-api/system/auth/ { return 404; }
    location /admin-api/system/ {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 120s;
        access_log off;
    }
    # The creator stores private encrypted media. Use an authenticated file-id download.
    location ~ ^/admin-api/infra/file/[0-9]+/get/ { return 404; }
    location /admin-api/infra/ {
        proxy_pass http://backend:48080;
        proxy_set_header tenant-id 1;
        proxy_read_timeout 120s;
        access_log off;
    }
    location /admin-api/ { return 404; }
    location /app-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
